# Builds today's TikTok post and schedules it in Buffer, every morning.
# Also runs from the Actions tab ("Run workflow"), where you can pick a topic
# or build without sending.
#
# Secret needed (repo Settings -> Secrets and variables -> Actions):
#   BUFFER_API_KEY  from publish.buffer.com/settings/api
#                   (leave it unset and the job builds the post but sends nothing)

name: Daily TikTok post

on:
  schedule:
    # 04:00 UTC. GitHub's timer often runs hours late, so the job starts early
    # and Buffer holds each post until its carouselTimes entry in config.json
    # (London time). One run builds and schedules all postsPerDay posts.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic id from topics.json (blank = today's rotation)"
        required: false
      send:
        description: "Send to Buffer"
        type: boolean
        default: true

permissions:
  contents: write # lets the job push the day's images to the "posts" branch

jobs:
  post:
    runs-on: ubuntu-24.04 # pinned: Playwright 1.58 does not support Ubuntu 26 yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build today's posts
        run: |
          n=$(node -p "require('./config.json').postsPerDay || 1")
          node build.mjs ${{ inputs.topic && format('--topic {0}', inputs.topic) || '' }}
          for s in $(seq 2 $n); do node build.mjs --slot $s; done

      - name: Keep a copy of the post (Actions tab -> this run -> Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-post
          path: output/
          retention-days: 14

      - name: Schedule in Buffer
        if: ${{ github.event_name == 'schedule' || inputs.send }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          n=$(node -p "require('./config.json').postsPerDay || 1")
          for s in $(seq 1 $n); do node post.mjs --slot $s; done

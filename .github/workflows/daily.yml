# Builds today's TikTok post and schedules it in Buffer, every morning.
# Also runs from the Actions tab ("Run workflow"), where you can pick a topic
# or build without sending.
#
# Secrets needed (repo Settings -> Secrets and variables -> Actions):
#   LOYLY_TOKEN     a GitHub token that can read dbinchy/loyly (for venues.json)
#   BUFFER_API_KEY  from publish.buffer.com/settings/api
#                   (leave it unset and the job builds the post but sends nothing)

name: Daily TikTok post

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC = 7am in winter, 8am in summer (London)
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic id from topics.json (blank = today's rotation)"
        required: false
      send:
        description: "Send to Buffer"
        type: boolean
        default: true

permissions:
  contents: write # lets the job push the day's images to the "posts" branch

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Get venues.json from the SaunaHop repo
        uses: actions/checkout@v4
        with:
          repository: dbinchy/loyly
          token: ${{ secrets.LOYLY_TOKEN }}
          path: loyly
          sparse-checkout: data/venues.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Build today's post
        env:
          LOYLY_DIR: loyly
        run: node build.mjs ${{ inputs.topic && format('--topic {0}', inputs.topic) || '' }}

      - name: Keep a copy of the post (Actions tab -> this run -> Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-post
          path: output/
          retention-days: 14

      - name: Schedule in Buffer
        if: ${{ github.event_name == 'schedule' || inputs.send }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node post.mjs

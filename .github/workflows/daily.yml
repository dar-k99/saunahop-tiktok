# Builds today's TikTok post and schedules it in Buffer, every morning.
# Also runs from the Actions tab ("Run workflow"), where you can pick a topic
# or build without sending.
#
# Secret needed (repo Settings -> Secrets and variables -> Actions):
#   BUFFER_API_KEY  from publish.buffer.com/settings/api
#                   (leave it unset and the job builds the post but sends nothing)

name: Daily TikTok post

on:
  schedule:
    # GitHub's timer is in UTC and can run late, so there are two timers and
    # the first step keeps the one that is 3:30pm in London:
    # 14:30 UTC in summer (BST), 15:30 UTC in winter (GMT).
    - cron: "30 14 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic id from topics.json (blank = today's rotation)"
        required: false
      send:
        description: "Send to Buffer"
        type: boolean
        default: true

permissions:
  contents: write # lets the job push the day's images to the "posts" branch

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Only run at 3:30pm London time
        id: time
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # +0100 in summer, +0000 in winter
            if [ "$(TZ=Europe/London date +%z)" = "+0100" ]; then wanted="30 14 * * *"; else wanted="30 15 * * *"; fi
            if [ "${{ github.event.schedule }}" != "$wanted" ]; then
              echo "This is the other timer (not 3:30pm in London), so skipping."
              go=false
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.time.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.time.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.time.outputs.go == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.time.outputs.go == 'true'
      - name: Build today's post
        if: steps.time.outputs.go == 'true'
        run: node build.mjs ${{ inputs.topic && format('--topic {0}', inputs.topic) || '' }}

      - name: Keep a copy of the post (Actions tab -> this run -> Artifacts)
        if: steps.time.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-post
          path: output/
          retention-days: 14

      - name: Schedule in Buffer
        if: ${{ steps.time.outputs.go == 'true' && (github.event_name == 'schedule' || inputs.send) }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node post.mjs
